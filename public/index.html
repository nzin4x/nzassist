<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a73e8" />
    <meta name="description" content="Google Tasks를 백엔드로 쓰는 개인용 할일 매니저" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <title>nzassist</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="nzassist 홈"><img class="brand-logo" src="/logo.svg" alt="" /><span>assist</span></a>
        <div class="search-wrap" id="search-wrap">
          <button id="search-toggle" class="search-icon" type="button" aria-label="검색 열기" title="검색 열기">⌕</button>
          <input id="search" autocomplete="off" spellcheck="false"
                 placeholder="검색   ·   #태그 @컨텍스트   ·   updated < 1d   ·   created < 10d and #급함" />
          <button id="search-clear" class="search-action" type="button" aria-label="검색어 지우기" title="검색어 지우기">×</button>
          <button id="search-close" class="search-action" type="button" aria-label="검색 닫기" title="검색 닫기">×</button>
          <div id="search-suggest" class="suggest hidden" role="listbox"></div>
        </div>
        <div class="account-bar">
          <span class="account-name hidden" id="account-name"></span>
          <button class="account-action" id="login" type="button">Google 로그인</button>
          <button class="account-action hidden" id="logout" type="button">로그아웃</button>
          <div class="status-pill"><span class="status-dot" id="status-dot"></span><span id="status">연결 중…</span></div>
        </div>
      </header>

      <nav class="filters" id="filters">
        <button data-filter="overdue" class="filter">밀린 항목 <span class="n" id="n-overdue">0</span></button>
        <button data-filter="today" class="filter is-active">오늘 <span class="n" id="n-today">0</span></button>
        <button data-filter="week" class="filter">이번 주 <span class="n" id="n-week">0</span></button>
        <button data-filter="all" class="filter">전체 <span class="n" id="n-all">0</span></button>
        <button data-filter="someday" class="filter">날짜 없음 <span class="n" id="n-someday">0</span></button>
      </nav>

      <div class="lists" id="lists"></div>

      <section class="tasks">
        <div id="task-list"></div>
        <p id="empty" class="empty hidden">여기에는 아무것도 없습니다.</p>
      </section>

      <footer>
        <span>nzassist</span>
        <span id="foot-note">Google Tasks 백엔드 · 시각은 notes의 at= 이 원본 · ? 로 단축키 보기</span>
        <span class="legal-links"><a href="/privacy">개인정보처리방침</a><a href="/terms">서비스 약관</a></span>
      </footer>
    </main>
    <button id="new-task-fab" class="new-task-fab" type="button" aria-label="새 할 일" title="새 할 일">+</button>
    <div id="overlay" class="overlay hidden"></div>
    <script src="/config.js" onerror="window.NZASSIST_CONFIG = {}"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
